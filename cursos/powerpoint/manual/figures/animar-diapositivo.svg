<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Um diapositivo, uma ideia</title><desc id="d">Animação esquemática que revela um título com mensagem, dois pontos de apoio e um gráfico simples.</desc><defs><style>*{font-family:Arial,sans-serif}.bg{fill:#f5f6f8}.navy{fill:#102b43}.muted{fill:#647689}.screen{fill:#fff;stroke:#dce3e9;stroke-width:3}.title{animation:appear 5s ease-out infinite}.line1{animation:appear 5s ease-out infinite;animation-delay:.8s}.line2{animation:appear 5s ease-out infinite;animation-delay:1.4s}.chart{animation:appear 5s ease-out infinite;animation-delay:2s}.bar{transform-origin:bottom;animation:grow 5s ease-out infinite}@keyframes appear{0%,10%{opacity:0;transform:translateY(8px)}25%,100%{opacity:1;transform:translateY(0)}}@keyframes grow{0%,35%{transform:scaleY(.05)}60%,100%{transform:scaleY(1)}}</style></defs><rect width="960" height="540" rx="24" class="bg"/><text x="52" y="65" class="navy" font-size="28" font-weight="700">Desenhe um diapositivo fácil de acompanhar</text><text x="52" y="98" class="muted" font-size="16">Título com conclusão · apoio curto · visual com propósito</text><rect x="120" y="140" width="720" height="318" rx="24" class="screen"/><rect x="120" y="140" width="720" height="22" rx="12" fill="#b95736"/><g transform="translate(170 201)"><g class="title"><rect width="330" height="24" rx="12" fill="#b95736"/><rect y="37" width="270" height="12" rx="6" fill="#d8dfe5"/></g><g class="line1"><circle cx="10" cy="120" r="7" fill="#d78051"/><rect x="34" y="114" width="254" height="12" rx="6" fill="#9aaab8"/></g><g class="line2"><circle cx="10" cy="160" r="7" fill="#d78051"/><rect x="34" y="154" width="218" height="12" rx="6" fill="#9aaab8"/></g><g class="chart" transform="translate(390 56)"><path d="M0 171h204" stroke="#cdd7de" stroke-width="3"/><rect x="20" y="101" width="36" height="70" rx="6" fill="#d78051" class="bar"/><rect x="78" y="68" width="36" height="103" rx="6" fill="#c76643" class="bar"/><rect x="136" y="26" width="36" height="145" rx="6" fill="#ad4e31" class="bar"/><text x="96" y="198" text-anchor="middle" class="muted" font-size="14">Resultado ao longo do tempo</text></g></g><text x="52" y="495" class="muted" font-size="14">ATC · esquema pedagógico original · não representa a interface do Microsoft PowerPoint</text></svg>
