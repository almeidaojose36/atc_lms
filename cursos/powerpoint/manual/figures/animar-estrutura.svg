<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Estruturar a apresentação</title><desc id="d">Três cartões animados mostram a abertura, o desenvolvimento e a conclusão.</desc><defs><style>*{font-family:Arial,sans-serif}.bg{fill:#f5f6f8}.navy{fill:#102b43}.muted{fill:#647689}.card{fill:#fff;stroke:#e2e5e8;stroke-width:2}.one{animation:show 6s ease-in-out infinite}.two{animation:show 6s ease-in-out infinite;animation-delay:2s}.three{animation:show 6s ease-in-out infinite;animation-delay:4s}@keyframes show{0%,20%,100%{transform:translateY(12px);opacity:.55}35%,72%{transform:translateY(0);opacity:1}}</style></defs><rect width="960" height="540" rx="24" class="bg"/><text x="52" y="65" class="navy" font-size="28" font-weight="700">Uma sequência que orienta o público</text><text x="52" y="98" class="muted" font-size="16">Organize a mensagem antes de escolher o design</text><g transform="translate(57 160)" class="one"><rect width="245" height="262" rx="18" class="card"/><rect width="245" height="13" rx="7" fill="#b95736"/><circle cx="40" cy="59" r="20" fill="#fae9e1"/><text x="40" y="65" text-anchor="middle" fill="#ad4e31" font-size="17" font-weight="700">01</text><text x="29" y="117" class="navy" font-size="22" font-weight="700">Abertura</text><text x="29" y="157" class="muted" font-size="16">Apresente o tema</text><text x="29" y="183" class="muted" font-size="16">e o objetivo.</text><rect x="29" y="216" width="184" height="12" rx="6" fill="#f0d2c6"/></g><path d="M322 290h40m-12-10 14 10-14 10" fill="none" stroke="#be6241" stroke-width="4"/><g transform="translate(371 160)" class="two"><rect width="245" height="262" rx="18" class="card"/><rect width="245" height="13" rx="7" fill="#d78051"/><circle cx="40" cy="59" r="20" fill="#fff0e4"/><text x="40" y="65" text-anchor="middle" fill="#b96d3d" font-size="17" font-weight="700">02</text><text x="29" y="117" class="navy" font-size="22" font-weight="700">Desenvolvimento</text><text x="29" y="157" class="muted" font-size="16">Explique as ideias</text><text x="29" y="183" class="muted" font-size="16">com exemplos.</text><rect x="29" y="216" width="184" height="12" rx="6" fill="#f4e1d2"/></g><path d="M636 290h40m-12-10 14 10-14 10" fill="none" stroke="#be6241" stroke-width="4"/><g transform="translate(685 160)" class="three"><rect width="218" height="262" rx="18" class="card"/><rect width="218" height="13" rx="7" fill="#627d8d"/><circle cx="40" cy="59" r="20" fill="#e7eff3"/><text x="40" y="65" text-anchor="middle" fill="#47677a" font-size="17" font-weight="700">03</text><text x="29" y="117" class="navy" font-size="22" font-weight="700">Conclusão</text><text x="29" y="157" class="muted" font-size="16">Reforce a ideia</text><text x="29" y="183" class="muted" font-size="16">e o próximo passo.</text><rect x="29" y="216" width="160" height="12" rx="6" fill="#dce8ed"/></g><text x="52" y="490" class="muted" font-size="14">ATC · esquema pedagógico original · não representa a interface do Microsoft PowerPoint</text></svg>
