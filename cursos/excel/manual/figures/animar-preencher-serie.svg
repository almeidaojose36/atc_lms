<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Continuar uma série com o preenchimento automático</title><desc id="desc">Animação que seleciona Jan e Fev, agarra a alça de preenchimento e completa os meses até Jun.</desc>
<defs><style>*{font-family:Arial,sans-serif}.bg{fill:#f4f6f8}.panel{fill:#fff;stroke:#dce3e9;stroke-width:2}.navy{fill:#102b43}.muted{fill:#647689}.orange{fill:#e96b22}.grid{stroke:#cbd5df;stroke-width:2}.cell{fill:#fff}.seed{fill:#fff0e6}.rest{fill:#eff8f2;animation:fill 7s ease-in-out infinite}.sel{fill:none;stroke:#e96b22;stroke-width:4;stroke-dasharray:7 5;animation:selection 7s ease-in-out infinite}.handle{fill:#e96b22;animation:drag 7s ease-in-out infinite}.cursor{animation:cursor 7s ease-in-out infinite}@keyframes fill{0%,38%{opacity:.15}53%,100%{opacity:1}}@keyframes selection{0%,15%{opacity:0}20%,88%{opacity:1}95%,100%{opacity:0}}@keyframes drag{0%,43%{transform:translate(0,0)}65%,100%{transform:translate(325px,0)}}@keyframes cursor{0%,45%{transform:translate(355px,244px);opacity:0}50%{transform:translate(440px,282px);opacity:1}70%{transform:translate(765px,282px);opacity:1}85%,100%{transform:translate(765px,282px);opacity:0}}</style></defs>
<rect width="960" height="540" rx="24" class="bg"/><text x="52" y="62" class="navy" font-size="28" font-weight="700">Continuar uma série de meses</text><text x="52" y="94" class="muted" font-size="16">Dê ao Excel dois valores iniciais para reconhecer o padrão</text>
<rect x="80" y="142" width="800" height="290" rx="16" class="panel"/><text x="120" y="187" class="navy" font-size="18" font-weight="700">Planeamento de formação</text><g transform="translate(120 218)"><rect width="720" height="108" fill="#fff" stroke="#cbd5df" stroke-width="2"/><rect x="0" y="0" width="720" height="36" class="navy"/><path d="M0 36h720M0 72h720M120 0v108M220 0v108M320 0v108M420 0v108M520 0v108M620 0v108" class="grid"/><g fill="none" class="grid"><path d="M0 36h720M0 72h720"/></g><text x="60" y="24" text-anchor="middle" fill="white" font-size="14" font-weight="700">Indicador</text><g fill="white" font-size="14" font-weight="700" text-anchor="middle"><text x="170" y="24">1</text><text x="270" y="24">2</text><text x="370" y="24">3</text><text x="470" y="24">4</text><text x="570" y="24">5</text><text x="670" y="24">6</text></g><text x="60" y="62" text-anchor="middle" class="navy" font-size="14">Mês</text><rect x="121" y="37" width="98" height="34" class="seed"/><rect x="221" y="37" width="98" height="34" class="seed"/><rect x="321" y="37" width="398" height="34" class="rest"/><g fill="#102b43" font-size="15" text-anchor="middle"><text x="170" y="60">Jan</text><text x="270" y="60">Fev</text><text x="370" y="60">Mar</text><text x="470" y="60">Abr</text><text x="570" y="60">Mai</text><text x="670" y="60">Jun</text></g><rect x="121" y="37" width="198" height="34" class="sel"/><rect x="312" y="64" width="10" height="10" class="handle"/></g>
<g transform="translate(120 361)"><circle cx="14" cy="14" r="13" fill="#e96b22"/><text x="14" y="19" text-anchor="middle" fill="white" font-size="14" font-weight="700">1</text><text x="39" y="19" class="navy" font-size="15">Escreva Jan e Fev</text><circle cx="280" cy="14" r="13" fill="#e96b22"/><text x="280" y="19" text-anchor="middle" fill="white" font-size="14" font-weight="700">2</text><text x="305" y="19" class="navy" font-size="15">Selecione os dois</text><circle cx="556" cy="14" r="13" fill="#e96b22"/><text x="556" y="19" text-anchor="middle" fill="white" font-size="14" font-weight="700">3</text><text x="581" y="19" class="navy" font-size="15">Arraste a alça</text></g><text x="52" y="493" class="muted" font-size="14">ATC · Microsoft Excel · esquema pedagógico simplificado</text></svg>
