<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Criar um livro e começar em A1</title><desc id="desc">Animação esquemática de três passos: livro em branco, grelha e primeira célula selecionada.</desc>
<defs><style>*{font-family:Arial,sans-serif}.bg{fill:#f4f6f8}.panel{fill:#fff;stroke:#dce3e9;stroke-width:2}.navy{fill:#102b43}.muted{fill:#647689}.orange{fill:#e96b22}.grid{stroke:#cad5de;stroke-width:2}.sheet{fill:#fbfcfd;stroke:#cad5de;stroke-width:2}.focus{fill:#fff0e6;stroke:#e96b22;stroke-width:3;animation:sel 6s ease-in-out infinite}.one{animation:one 6s ease-in-out infinite}.two{animation:two 6s ease-in-out infinite}.three{animation:three 6s ease-in-out infinite}.cursor{animation:cursor 6s ease-in-out infinite}@keyframes one{0%,28%,100%{opacity:1}34%,62%{opacity:.35}}@keyframes two{0%,28%,64%,100%{opacity:.35}36%,58%{opacity:1}}@keyframes three{0%,58%,100%{opacity:.35}68%,91%{opacity:1}}@keyframes sel{0%,60%,100%{opacity:.25}70%,90%{opacity:1}}@keyframes cursor{0%,65%{transform:translate(320px,170px);opacity:0}72%{transform:translate(525px,282px);opacity:1}90%,100%{transform:translate(525px,282px);opacity:0}}</style></defs>
<rect width="960" height="540" rx="24" class="bg"/><text x="52" y="62" class="navy" font-size="28" font-weight="700">Criar um livro em branco</text><text x="52" y="94" class="muted" font-size="16">Comece por uma folha vazia e selecione onde vai trabalhar</text>
<g transform="translate(50 136)"><rect width="244" height="286" rx="16" class="panel"/><circle cx="36" cy="40" r="18" fill="#e96b22"/><text x="36" y="46" text-anchor="middle" fill="white" font-size="17" font-weight="700">1</text><text x="66" y="46" class="navy" font-size="18" font-weight="700">Novo livro</text><rect x="40" y="83" width="164" height="143" rx="10" fill="#f8fafb" stroke="#dce3e9" stroke-width="2"/><path d="M65 114h114M65 140h114M65 166h114M65 192h114M103 101v104M141 101v104" class="grid"/><text x="122" y="256" text-anchor="middle" class="muted" font-size="15">Escolha Livro em branco</text><text x="122" y="276" text-anchor="middle" class="orange" font-size="14" font-weight="700">ou prima Ctrl+N</text></g>
<path d="M315 278h36" stroke="#cbd5df" stroke-width="3"/><path d="m344 269 13 9-13 9" fill="none" stroke="#e96b22" stroke-width="3"/>
<g transform="translate(365 136)"><rect width="244" height="286" rx="16" class="panel"/><circle cx="36" cy="40" r="18" fill="#e96b22"/><text x="36" y="46" text-anchor="middle" fill="white" font-size="17" font-weight="700">2</text><text x="66" y="46" class="navy" font-size="18" font-weight="700">Folha pronta</text><g class="two"><rect x="35" y="91" width="174" height="116" rx="5" class="sheet"/><path d="M35 120h174M35 149h174M35 178h174M78 91v116M122 91v116M166 91v116" class="grid"/><text x="122" y="251" text-anchor="middle" class="muted" font-size="15">Colunas e linhas</text><text x="122" y="273" text-anchor="middle" class="muted" font-size="14">estão prontas</text></g></g>
<path d="M630 278h36" stroke="#cbd5df" stroke-width="3"/><path d="m659 269 13 9-13 9" fill="none" stroke="#e96b22" stroke-width="3"/>
<g transform="translate(680 136)"><rect width="230" height="286" rx="16" class="panel"/><circle cx="36" cy="40" r="18" fill="#e96b22"/><text x="36" y="46" text-anchor="middle" fill="white" font-size="17" font-weight="700">3</text><text x="66" y="46" class="navy" font-size="18" font-weight="700">Selecionar A1</text><g class="three"><rect x="28" y="91" width="174" height="116" rx="5" class="sheet"/><path d="M28 120h174M28 149h174M28 178h174M71 91v116M115 91v116M159 91v116" class="grid"/><rect x="29" y="92" width="41" height="27" class="focus"/><text x="115" y="250" text-anchor="middle" class="muted" font-size="14">A1 = coluna A, linha 1</text><text x="115" y="273" text-anchor="middle" class="orange" font-size="14" font-weight="700">introduza o primeiro título</text></g></g>
