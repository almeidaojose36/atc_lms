<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Introduzir dados numa folha de cálculo</title><desc id="desc">Animação de uma tabela de despesas fictícias em kwanzas, preenchida célula a célula.</desc>
<defs><style>*{font-family:Arial,sans-serif}.bg{fill:#f4f6f8}.panel{fill:#fff;stroke:#dce3e9;stroke-width:2}.navy{fill:#102b43}.muted{fill:#647689}.grid{stroke:#cbd5df;stroke-width:2}.head{fill:#102b43}.headText{fill:white;font-size:16px;font-weight:700}.cell{fill:#fff;stroke:#cbd5df;stroke-width:1}.select{fill:#fff0e6;stroke:#e96b22;stroke-width:3}.cursor{animation:move 8s steps(1,end) infinite}.v1,.v2,.v3,.v4,.v5,.v6,.v7,.v8{opacity:0;animation:show 8s steps(1,end) infinite}.v1{animation-delay:0s}.v2{animation-delay:1s}.v3{animation-delay:2s}.v4{animation-delay:3s}.v5{animation-delay:4s}.v6{animation-delay:5s}.v7{animation-delay:6s}.v8{animation-delay:7s}@keyframes show{0%,12%{opacity:0}13%,100%{opacity:1}}@keyframes move{0%,12%{transform:translate(310px,233px)}13%,24%{transform:translate(558px,233px)}25%,36%{transform:translate(310px,289px)}37%,48%{transform:translate(558px,289px)}49%,60%{transform:translate(310px,345px)}61%,72%{transform:translate(558px,345px)}73%,100%{transform:translate(558px,399px)}}</style></defs>
<rect width="960" height="540" rx="24" class="bg"/><text x="52" y="62" class="navy" font-size="28" font-weight="700">Preencher células com dados de exemplo</text><text x="52" y="94" class="muted" font-size="16">Cada valor fica numa célula própria; Enter confirma a entrada</text>
<rect x="104" y="138" width="752" height="302" rx="16" class="panel"/><text x="140" y="180" class="navy" font-size="18" font-weight="700">Despesas de formação ATC</text><g transform="translate(140 204)"><rect width="680" height="196" fill="#fff" stroke="#cbd5df" stroke-width="2"/><rect width="680" height="42" class="head"/><path d="M0 42h680M0 80h680M0 118h680M0 156h680M380 0v196" class="grid"/><g class="grid" fill="none"><path d="M0 80h680M0 118h680M0 156h680M0 194h680"/></g><text x="20" y="27" class="headText">Despesa</text><text x="400" y="27" class="headText">Valor (Kz)</text><rect x="1" y="43" width="378" height="36" class="select"/><g fill="#102b43" font-size="17"><text x="18" y="69" class="v1">Caderno</text><text x="400" y="69" class="v2">2 500</text><text x="18" y="107" class="v3">Transporte</text><text x="400" y="107" class="v4">6 000</text><text x="18" y="145" class="v5">Dados móveis</text><text x="400" y="145" class="v6">3 500</text><text x="18" y="183" class="v7">Total a calcular</text><text x="400" y="183" class="v8">12 000</text></g></g><g class="cursor"><path d="M0 0l0 27 7-7 7 14 6-3-7-13 11-1z" fill="#102b43" stroke="white" stroke-width="2"/></g><text x="140" y="424" class="muted" font-size="14">Dados fictícios · Kz = kwanza angolano</text><text x="52" y="493" class="muted" font-size="14">ATC · Microsoft Excel · esquema pedagógico simplificado</text></svg>
