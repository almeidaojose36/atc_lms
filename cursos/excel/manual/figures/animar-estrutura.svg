<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Estrutura de um livro de cálculo</title><desc id="desc">Animação esquemática que apresenta um livro, as folhas, linhas, colunas e células.</desc>
<defs><style>
*{font-family:Arial,sans-serif}.bg{fill:#f4f6f8}.card{fill:#fff;stroke:#dce3e9;stroke-width:2}.navy{fill:#102b43}.muted{fill:#647689}.orange{fill:#e96b22}.line{stroke:#cbd5df;stroke-width:2}.pulse{animation:pulse 5s ease-in-out infinite}.rise{animation:rise 5s ease-in-out infinite}.cell{fill:#fff;stroke:#cbd5df;stroke-width:1}.focus{fill:#fff0e6;stroke:#e96b22;stroke-width:3;animation:focus 5s ease-in-out infinite}
@keyframes pulse{0%,12%,100%{opacity:.55}18%,42%{opacity:1}50%{opacity:.55}}
@keyframes rise{0%,35%,100%{transform:translateY(12px);opacity:.4}42%,72%{transform:translateY(0);opacity:1}}
@keyframes focus{0%,58%,100%{fill:#fff}66%,91%{fill:#fff0e6}}
</style></defs>
<rect width="960" height="540" rx="24" class="bg"/><text x="52" y="62" class="navy" font-size="28" font-weight="700">Como se organiza o Excel</text><text x="52" y="94" class="muted" font-size="16">Livro → folhas → grelha de células</text>
<g transform="translate(50 142)"><rect width="228" height="286" rx="14" class="card"/><rect width="228" height="54" rx="14" class="navy"/><path d="M0 40h228v14H0z" class="navy"/><text x="22" y="35" fill="white" font-size="18" font-weight="700">LIVRO</text><g class="pulse"><path d="M46 105h128l25 25v119H46z" fill="#f8fafc" stroke="#d7e0e7" stroke-width="2"/><path d="M174 105v27h25" fill="none" stroke="#d7e0e7" stroke-width="2"/><rect x="64" y="151" width="116" height="16" rx="8" fill="#e9eef3"/><rect x="64" y="181" width="94" height="12" rx="6" fill="#e9eef3"/><rect x="64" y="205" width="107" height="12" rx="6" fill="#e9eef3"/></g><text x="114" y="263" text-anchor="middle" class="muted" font-size="15">Ficheiro de trabalho</text></g>
<path d="M300 285h48" class="line"/><path d="m340 276 13 9-13 9" fill="none" stroke="#e96b22" stroke-width="3"/>
<g transform="translate(365 142)" class="rise"><rect width="216" height="286" rx="14" class="card"/><rect width="216" height="54" rx="14" fill="#e96b22"/><path d="M0 40h216v14H0z" fill="#e96b22"/><text x="22" y="35" fill="white" font-size="18" font-weight="700">FOLHA</text><g transform="translate(35 99)"><rect width="146" height="96" rx="5" fill="#f9fbfc" stroke="#cad5de" stroke-width="2"/><path d="M0 32h146M0 64h146M48 0v96M97 0v96" fill="none" stroke="#cad5de" stroke-width="2"/><rect x="49" y="33" width="47" height="30" class="focus"/></g><text x="108" y="229" text-anchor="middle" class="muted" font-size="15">Linhas + colunas</text><text x="108" y="254" text-anchor="middle" class="muted" font-size="15">formam a grelha</text></g>
<path d="M604 285h48" class="line"/><path d="m644 276 13 9-13 9" fill="none" stroke="#e96b22" stroke-width="3"/>
<g transform="translate(668 142)"><rect width="242" height="286" rx="14" class="card"/><rect width="242" height="54" rx="14" class="navy"/><path d="M0 40h242v14H0z" class="navy"/><text x="22" y="35" fill="white" font-size="18" font-weight="700">CÉLULA A1</text><g transform="translate(32 107)"><rect width="178" height="102" rx="5" fill="#fff" stroke="#cad5de" stroke-width="2"/><path d="M0 34h178M0 68h178M59 0v102M118 0v102" fill="none" stroke="#cad5de" stroke-width="2"/><rect width="58" height="32" x="60" y="35" class="focus"/></g><text x="121" y="244" text-anchor="middle" class="muted" font-size="15">Coluna A + linha 1</text><text x="121" y="267" text-anchor="middle" class="orange" font-size="15" font-weight="700">endereço: A1</text></g>
<text x="52" y="493" class="muted" font-size="14">ATC · Microsoft Excel · esquema pedagógico simplificado</text></svg>
